<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dd6b20"/>
      <stop offset="100%" style="stop-color:#d69e2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="280" r="120" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.5"/>
  <circle cx="400" cy="280" r="80" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.4"/>
  <circle cx="400" cy="280" r="40" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.3"/>
  <text x="400" y="240" text-anchor="middle" fill="#d69e2e" font-family="serif" font-size="36" font-weight="bold">ELDEN RING</text>
  <text x="400" y="275" text-anchor="middle" fill="#a0a0a0" font-family="sans-serif" font-size="14">艾 尔 登 法 环</text>
  <line x1="250" y1="300" x2="550" y2="300" stroke="#dd6b20" stroke-width="1" opacity="0.6"/>
  <text x="400" y="340" text-anchor="middle" fill="#a0a0a0" font-family="sans-serif" font-size="12">攻略封面占位图</text>
  <!-- Small decorative runes -->
  <text x="300" y="380" fill="#dd6b20" font-size="20" opacity="0.3">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛇ ᛈ ᛉ ᛊ ᛏ ᛒ ᛖ ᛗ ᛚ ᛝ ᛟ ᛞ</text>
</svg>
